trigger: 
- main
- feature/*

pool: soonal_pool
variables: 
  source_workdirectory: $(System.DefaultWorkingDirectory)/environment/dev
  service_connection: new_connection
stages:
- stage: Install
  jobs:
    - job: InstallTerraform
      displayName: yaha pe terraform install hoga
      steps:
      - task: TerraformInstaller@1
        inputs:
          terraformVersion: 'latest'



- stage: Init_Validate
  jobs: 
   - job: Terraforminit_validate
     displayName: Terraform Init and Validate
     steps:
     - task: TerraformTask@5
       inputs:
         provider: 'azurerm'
         command: 'init'
         workingDirectory: $(source_workdirectory)
         backendServiceArm: $(service_connection)
         backendAzureRmStorageAccountName: 'ranjeetstgs123'
         backendAzureRmContainerName: 'rcontainer'
         backendAzureRmKey: 'rs.tfstate'
     - task: TerraformTask@5
       inputs:
         provider: 'azurerm'
         command: 'validate'
         workingDirectory: $(source_workdirectory)

- stage: plan
  jobs: 
  - job: terraformplan
    displayName: yaha terraformplan chalega

    steps: 
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: $(source_workdirectory)
        backendServiceArm: 'new_connection'
        backendAzureRmStorageAccountName: 'ranjeetstgs123'
        backendAzureRmContainerName: 'rcontainer'
        backendAzureRmKey: 'rs.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: $(source_workdirectory)
        environmentServiceNameAzureRM: $(service_connection)