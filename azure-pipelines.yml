trigger:
- main
- feature

pool: Soonal_pool
variables: 
  workingDirectory_path: '$(System.DefaultWorkingDirectory)/environment/dev'
  service_connection: 'new_connection'

stages:
  - stage: terraform_install
    jobs: 
     - job: install
       steps: 
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'

  - stage: terraform_init
    jobs: 
     - job: terraform_init
       steps: 
       - task: TerraformTask@5
         inputs:
           provider: 'azurerm'
           command: 'init'
           workingDirectory: $(workingDirectory_path)
           backendServiceArm: $(service_connection)
           backendAzureRmResourceGroupName: 'rgs'
           backendAzureRmStorageAccountName: 'ranjeetstgs123'
           backendAzureRmContainerName: 'rcontainer'
           backendAzureRmKey: 'rs.tfstate'

  - stage: terraform_plan
    jobs: 
     - job: terraform_plan
       steps:
       - task: TerraformTask@5
         inputs:
           provider: 'azurerm'
           command: 'init'
           workingDirectory: $(workingDirectory_path)
           backendServiceArm: $(service_connection)
           backendAzureRmResourceGroupName: 'rgs'
           backendAzureRmStorageAccountName: 'ranjeetstgs123'
           backendAzureRmContainerName: 'rcontainer'
           backendAzureRmKey: 'rs.tfstate'
       - task: TerraformTask@5
         inputs:
           provider: 'azurerm'
           command: 'plan'
           workingDirectory: $(workingDirectory_path)
           environmentServiceNameAzureRM: $(service_connection)
      #  - task: ManualValidation@1
      #    inputs:
      #      notifyUsers: 'ranjeetsinghazad11@gmail.com'
      #      approvers: 'ranjeetsinghazad11@gmail.com'
      #      instructions: 'please approve after plan'
  - stage: terraform_apply
    jobs: 
     - job: terraform_apply
       steps:
       - task: TerraformTask@5
         inputs:
           provider: 'azurerm'
           command: 'apply'
           workingDirectory: '$(workingDirectory_path)'
           commandOptions: '-auto-approve'
           environmentServiceNameAzureRM: $(service_connection)