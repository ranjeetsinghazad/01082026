trigger: 
 - main
 - features/*
pool: soonal_pool

parameters: 
- name: new_parameter
  displayName: parameter_add
  type: string
  default: true
  values:
    - true
    - false

stages:
- stage: init_stage
  jobs:
  - job: 
    displayName: init
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        backendServiceArm: 'new_connection'
        backendAzureRmResourceGroupName: 'ranjeetstgs123'
        backendAzureRmStorageAccountName: 'ranjeetstg431'
        backendAzureRmContainerName: 'rcontainer'
        backendAzureRmKey: 'rs.tfstate'
- stage: plan_stage
  jobs:
  - job: init_plan
    displayName: plan
    
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        backendServiceArm: 'new_connection'
        backendAzureRmResourceGroupName: 'ranjeetstgs123'
        backendAzureRmStorageAccountName: 'ranjeetstg431'
        backendAzureRmContainerName: 'rcontainer'
        backendAzureRmKey: 'rs.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        environmentServiceNameAzureRM: 'new_connection'

- stage: init_apply
  jobs:
  - job: init_apply
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.new_parameter }}', 'true'))
    
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        backendServiceArm: 'new_connection'
        backendAzureRmResourceGroupName: 'ranjeetstgs123'
        backendAzureRmStorageAccountName: 'ranjeetstg431'
        backendAzureRmContainerName: 'rcontainer'
        backendAzureRmKey: 'rs.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        commandOptions: '-auto-approve'
        environmentServiceNameAzureRM: 'new_connection'