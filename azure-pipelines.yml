trigger:
- main
- feature

pool: Soonal_pool


stages:
- stage: terraforminstall
  jobs:
  - job: install
    displayName: yaha pe terrafom install chalega
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
- stage: terraform_init
  jobs:
  - job: terraform_init
    displayName: yaha pe terraform inti chalega
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'new_connection'
        backendAzureRmResourceGroupName: 'rgs'
        backendAzureRmStorageAccountName: 'ranjeetstg'
        backendAzureRmContainerName: 'Containers'
        backendAzureRmKey: 'ranjeet.tfstate'


- stage: terraform_plan
  jobs:
  - job: terraform_plan
    displayName: yaha pe terraform plan chalega
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/dev'
        environmentServiceNameAzureRM: 'new_connection'