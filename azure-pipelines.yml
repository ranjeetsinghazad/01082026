trigger:
- main
- feature

pool: Soonal_pool


stages:
- stage: terraforminstall
  jobs:
  - job: install
    displayName: yaha pe terrafom install chalega
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
- stage: terraforminit
  jobs:
  - job: terraforminit
    displayName: yaha pe terraform inti chalega
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'new_connection'
        backendAzureRmResourceGroupName: 'rgs'
        backendAzureRmStorageAccountName: 'ranjeetstg'
        backendAzureRmContainerName: 'Containers'
        backendAzureRmKey: 'ranjeet.tfstate'
