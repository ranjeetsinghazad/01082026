trigger:
- any

pool: Agent pools

stages:
- stage: Init_stage
  jobs:
  - job: TerraformInit
    displayName: to bhai yaha pe init chalega
    # steps:
    # - task: TerraformTask@5
    #   inputs:
    #     provider: 'azurerm'
    #     command: 'init'
    #     backendServiceArm: 'newasr'
    #     backendAzureRmResourceGroupName: 'for-backend'
    #     backendAzureRmStorageAccountName: 'pipelinekeliye'
    #     backendAzureRmContainerName: 'pipestorage'
    #     backendAzureRmKey: 'dev12.state'

- stage: Scanning_stage
  jobs:
  - job: Tfsec
    displayName: to bhai yaha pe scan hoga
    steps:
    - task: tfsec@1
      inputs:
        version: 'v1.26.0'

- stage: TerraformInit
  jobs:
  - job: TerraformpInit
    displayName: to bhai yaha pe Init chalega
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'newasr'
        backendAzureRmResourceGroupName: 'for-backend'
        backendAzureRmStorageAccountName: 'pipelinekeliye'
        backendAzureRmContainerName: 'pipestorage'
        backendAzureRmKey: 'dev12.state'
    
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'newasr'